<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciamento de Produtos</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <h1>Gerenciamento de Produtos</h1>

    <!-- Sessão do Usuário -->
    <section class="card" id="card-sessao">
      <div class="sessao-container">
        <p>Conectado como: <strong id="usuario-logado">admin</strong></p>
        <button id="btn-logout" class="btn-danger" type="button">Sair</button>
      </div>
    </section>

    <!-- Cadastro -->
    <section class="card" id="card-cadastro">
      <h2>Cadastrar Novo Produto</h2>
      <form id="form-produto">
        <div class="campo">
          <label for="id">ID:</label>
          <input type="number" id="id" required placeholder="Ex: 101">
        </div>
        <div class="campo">
          <label for="nome">Nome:</label>
          <input type="text" id="nome" required placeholder="Ex: Teclado Mecânico">
        </div>
        <div class="campo">
          <label for="preco">Preço (R$):</label>
          <input type="number" step="0.01" id="preco" required placeholder="Ex: 250.00">
        </div>
        <div class="campo">
          <label for="categoria">Categoria:</label>
          <input type="text" id="categoria" required placeholder="Ex: Periféricos">
        </div>
        <div class="campo">
          <label for="estoque">Estoque:</label>
          <input type="number" id="estoque" required placeholder="Ex: 15">
        </div>
        <button type="submit" id="btn-cadastrar">Cadastrar Produto</button>
      </form>
    </section>

    <!-- Listagem -->
    <section class="card">
      <h2>Produtos Cadastrados</h2>
      <div id="lista-produtos" class="grid-produtos"></div>
    </section>
  </div>

  <script src="../js/produtos.js"></script>
</body>
</html>
