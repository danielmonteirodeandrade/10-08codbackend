<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja de Informática - Produtos</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <h1>Gerenciamento de Produtos</h1>

    <!-- Card de Autenticação -->
    <section class="card" id="card-login">
      <h2>Acesso ao Sistema</h2>
      <form id="form-login">
        <div class="campo">
          <label for="username">Usuário:</label>
          <input type="text" id="username" placeholder="Usuário padrão: admin" required>
        </div>
        <div class="campo">
          <label for="password">Senha:</label>
          <input type="password" id="password" placeholder="Senha padrão: 123456" required>
        </div>
        <button type="submit">Entrar</button>
      </form>
    </section>

    <!-- Indicador de Usuário Logado -->
    <section class="card oculto" id="card-sessao">
      <div class="sessao-container">
        <p>Conectado como: <strong id="usuario-logado">admin</strong></p>
        <button id="btn-logout" class="btn-danger">Sair</button>
      </div>
    </section>

    <!-- Formulário de Cadastro (Visível apenas após login) -->
    <section class="card oculto" id="card-cadastro">
      <h2>Cadastrar Novo Produto</h2>
      <form id="form-produto">
        <div class="campo">
          <label for="id">ID:</label>
          <input type="number" id="id" required>
        </div>
        <div class="campo">
          <label for="nome">Nome:</label>
          <input type="text" id="nome" required>
        </div>
        <div class="campo">
          <label for="preco">Preço (R$):</label>
          <input type="number" step="0.01" id="preco" required>
        </div>
        <div class="campo">
          <label for="categoria">Categoria:</label>
          <input type="text" id="categoria" required>
        </div>
        <div class="campo">
          <label for="estoque">Estoque:</label>
          <input type="number" id="estoque" required>
        </div>
        <button type="submit">Cadastrar Produto</button>
      </form>
    </section>

    <!-- Listagem -->
    <section class="card">
      <h2>Produtos Cadastrados</h2>
      <div id="lista-produtos" class="grid-produtos"></div>
    </section>
  </div>

  <script src="/js/script.js"></script>
</body>
</html>
