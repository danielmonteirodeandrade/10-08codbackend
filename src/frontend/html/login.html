<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso ao Sistema - Loja de Informática</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <h1>Loja de Informática</h1>

    <section class="card" id="card-login">
      <h2>Acesso ao Sistema</h2>
      <form id="form-login">
        <div class="campo">
          <label for="username">Usuário:</label>
          <input type="text" id="username" placeholder="Usuário padrão: admin" required>
        </div>
        <div class="campo">
          <label for="password">Senha:</label>
          <input type="password" id="password" placeholder="Senha padrão: 123456" required>
        </div>
        <button type="submit">Entrar</button>
      </form>
    </section>
  </div>

  <script src="../js/login.js"></script>
</body>
</html>
